<title>Katakana Stroke Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: a practice sheet, the twin of ../hiragana_table_site. The chart is a grid of ruled writing boxes
     (cross guides); a click opens a modal that draws the character stroke by stroke, from the dictionary's
     stroke data (../js/strokes.js, KanjiVG). There are no handwriting clips yet: when they exist, the stage
     takes a <video> as in the hiragana table. Red is the teacher's marker: the stroke being drawn and its number. */
  :root {
    --paper: #eef1f5;      /* bluish practice paper */
    --box: #fbfcfd;        /* writing box */
    --ink: #1a1e26;
    --ink-soft: #5b6574;
    --line: #b7c0cc;
    --guide: #d3d9e1;
    --red: #cf2f27;        /* marker red */
    --red-ink: #ffffff;
    --scrim: rgba(18, 22, 30, .55);
    --font-kana: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181e; --box: #1b2028; --ink: #e9edf3; --ink-soft: #97a2b2;
      --line: #3a4350; --guide: #2b323d; --red: #ff6a5c; --red-ink: #1b0b09;
      --scrim: rgba(0, 0, 0, .65); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14181e; --box: #1b2028; --ink: #e9edf3; --ink-soft: #97a2b2;
    --line: #3a4350; --guide: #2b323d; --red: #ff6a5c; --red-ink: #1b0b09;
    --scrim: rgba(0, 0, 0, .65); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 400 15px/1.5 var(--font-body);
    padding-block: 32px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { display: grid; gap: 6px; margin-bottom: 28px; }
  h1 { margin: 0; font: 600 clamp(26px, 6vw, 34px)/1.1 var(--font-body); letter-spacing: -.01em; text-wrap: balance; }
  header p { margin: 0; color: var(--ink-soft); max-width: 46ch; text-wrap: pretty; }
  header .mark { color: var(--red); font-weight: 500; }

  /* chart */
  .chart {
    display: grid;
    grid-template-columns: minmax(18px, 28px) repeat(5, minmax(0, 1fr));
    gap: 6px;
    align-items: center;
  }
  .col-h, .row-h {
    font: 500 11px/1 var(--font-mono); color: var(--ink-soft);
    text-transform: lowercase; letter-spacing: .06em; text-align: center;
  }
  .col-h { padding-bottom: 2px; }
  .row-h { text-align: left; }

  .cell, .gap {
    aspect-ratio: 1; width: 100%;
    border-radius: 3px;
  }
  .cell, .stage {
    background-color: var(--box);
    background-image:
      repeating-linear-gradient(to bottom, var(--guide) 0 3px, transparent 3px 7px),
      repeating-linear-gradient(to right, var(--guide) 0 3px, transparent 3px 7px);
    background-size: 1px 100%, 100% 1px;
    background-position: 50% 0, 0 50%;
    background-repeat: no-repeat;
  }
  .cell {
    position: relative; display: grid; place-items: center;
    border: 1px solid var(--line);
    color: var(--ink); cursor: pointer; padding: 0;
    font: 400 clamp(28px, 8.5vw, 50px)/1 var(--font-kana);
    transition: border-color .12s, box-shadow .12s, transform .12s;
  }
  .cell .kana { position: relative; }
  .cell .ro {
    position: absolute; right: 6px; bottom: 4px;
    font: 400 10px/1 var(--font-mono); color: var(--ink-soft); letter-spacing: .02em;
  }
  .cell:hover { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); transform: translateY(-1px); }
  .cell:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .cell:active { transform: translateY(0); }
  .gap { border: 1px dashed var(--guide); opacity: .7; }

  .foot { margin-top: 22px; color: var(--ink-soft); font-size: 13px; display: flex; gap: 8px 18px; flex-wrap: wrap; }
  .foot a { color: inherit; }
  .foot kbd {
    font: 500 11px/1 var(--font-mono); padding: 2px 5px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--box); color: var(--ink);
  }

  /* popup */
  dialog {
    padding: 0; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper); color: var(--ink);
    width: min(720px, calc(100vw - 24px)); max-height: calc(100dvh - 24px);
    overflow: auto; overscroll-behavior: contain;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  dialog::backdrop { background: var(--scrim); backdrop-filter: blur(3px); }
  .sheet { display: grid; gap: 14px; padding: 16px; }
  .top { display: flex; align-items: flex-end; gap: 14px; }
  .big { font: 400 64px/1 var(--font-kana); }
  .meta { display: grid; gap: 2px; padding-bottom: 6px; min-width: 0; }
  .romaji { font: 500 20px/1.1 var(--font-mono); }
  .pos { font: 400 12px/1 var(--font-mono); color: var(--ink-soft); }
  .close {
    margin-left: auto; align-self: flex-start;
    width: 36px; height: 36px; border-radius: 3px; border: 1px solid var(--line);
    background: var(--box); color: var(--ink); cursor: pointer; font: 400 20px/1 var(--font-body);
  }
  /* Same footprint as the hiragana table's video, holding the stroke-order drawing. */
  .stage {
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 3px;
    aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden;
    container-type: size;
  }
  .glyph { font: 400 160px/1 var(--font-kana); }   /* shown only when the stroke data is missing */
  @supports (font-size: 1cqh) { .glyph { font-size: 72cqh; } }
  .draw { display: block; height: 100%; aspect-ratio: 1; max-width: 100%; }
  .draw path { fill: none; stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; }
  .draw .ghost path { stroke: var(--guide); }
  .draw .ink path { stroke: var(--ink); stroke-dasharray: 1 1; }
  .draw .ink path.cur { stroke: var(--red); }
  .draw text {
    fill: var(--red); font: 500 5.5px var(--font-mono);
    paint-order: stroke; stroke: var(--box); stroke-width: 2px; stroke-linejoin: round;
  }
  .pos .k { font-family: var(--font-kana); font-size: 14px; color: var(--ink); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--box); }
  .seg button { border: 0; border-right: 1px solid var(--line); border-radius: 0; }
  .seg button:last-child { border-right: 0; }
  .controls button {
    font: 500 13px/1 var(--font-body); color: var(--ink); background: var(--box);
    border: 1px solid var(--line); border-radius: 3px; padding: 9px 12px; min-height: 36px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--red); }
  .controls button[aria-pressed="true"], .seg button[aria-pressed="true"] {
    background: var(--red); color: var(--red-ink); border-color: var(--red);
  }
  .controls .nav { margin-left: auto; display: flex; gap: 8px; }
  .controls .nav .k { font-family: var(--font-kana); font-size: 16px; margin: 0 4px; }
  .close:hover { border-color: var(--red); }
  .close:focus-visible, .controls button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  @media (max-width: 480px) {
    .big { font-size: 52px; }
    .glyph { font-size: 120px; }
    .controls .nav { margin-left: 0; width: 100%; }
    .controls .nav button { flex: 1; }
    .cell .ro { right: 4px; bottom: 3px; font-size: 9px; }
    .chart { gap: 5px; }
  }
  @media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Katakana Stroke Table</h1>
    <p>Pick a character to watch it drawn stroke by stroke. <span class="mark">Red</span> marks the stroke being written and the order of each one.</p>
  </header>

  <div class="chart" id="chart" role="group" aria-label="Katakana chart"></div>

  <div class="foot">
    <span>46 basic characters</span>
    <span><kbd>←</kbd> <kbd>→</kbd> next and previous in the popup</span>
    <span><kbd>Esc</kbd> closes it</span>
    <span>Stroke data: <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>, CC BY-SA 3.0</span>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="sheet">
    <div class="top">
      <div class="big" id="dlg-kana" lang="ja">ア</div>
      <div class="meta">
        <div class="romaji" id="dlg-title">a</div>
        <div class="pos"><span id="dlg-pos">1 / 46</span> · hiragana <span class="k" id="dlg-hira" lang="ja">あ</span></div>
      </div>
      <button class="close" id="close" type="button" aria-label="Close">×</button>
    </div>

    <div class="stage" id="stage"></div>

    <div class="controls">
      <button id="replay" type="button">Replay</button>
      <div class="seg" role="group" aria-label="Drawing speed">
        <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="1.5" aria-pressed="false">1.5×</button>
      </div>
      <button id="loop" type="button" aria-pressed="true">Loop</button>
      <div class="nav">
        <button id="prev" type="button" aria-label="Previous character"><span aria-hidden="true">←</span><span class="k" id="prev-k" lang="ja"></span></button>
        <button id="next" type="button" aria-label="Next character"><span class="k" id="next-k" lang="ja"></span><span aria-hidden="true">→</span></button>
      </div>
    </div>
  </div>
</dialog>

<script src="../js/strokes.js"></script>
<script>
  // Chart order: rows are consonants, columns are vowels. null = no such sound.
  var ROWS = [
    ["",  [["ア","a"],["イ","i"],["ウ","u"],["エ","e"],["オ","o"]]],
    ["k", [["カ","ka"],["キ","ki"],["ク","ku"],["ケ","ke"],["コ","ko"]]],
    ["s", [["サ","sa"],["シ","shi"],["ス","su"],["セ","se"],["ソ","so"]]],
    ["t", [["タ","ta"],["チ","chi"],["ツ","tsu"],["テ","te"],["ト","to"]]],
    ["n", [["ナ","na"],["ニ","ni"],["ヌ","nu"],["ネ","ne"],["ノ","no"]]],
    ["h", [["ハ","ha"],["ヒ","hi"],["フ","fu"],["ヘ","he"],["ホ","ho"]]],
    ["m", [["マ","ma"],["ミ","mi"],["ム","mu"],["メ","me"],["モ","mo"]]],
    ["y", [["ヤ","ya"],null,["ユ","yu"],null,["ヨ","yo"]]],
    ["r", [["ラ","ra"],["リ","ri"],["ル","ru"],["レ","re"],["ロ","ro"]]],
    ["w", [["ワ","wa"],null,null,null,["ヲ","wo"]]],
    ["–", [["ン","n"],null,null,null,null]]
  ];
  var VOWELS = ["a","i","u","e","o"];

  var chart = document.getElementById("chart");
  var flat = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // Each basic katakana sits 0x60 code points after its hiragana.
  function hira(k) { return String.fromCharCode(k.charCodeAt(0) - 0x60); }

  chart.appendChild(el("span"));
  VOWELS.forEach(function (v) { chart.appendChild(el("span", "col-h", v)); });

  ROWS.forEach(function (row) {
    chart.appendChild(el("span", "row-h", row[0]));
    row[1].forEach(function (c) {
      if (!c) { chart.appendChild(el("span", "gap")); return; }
      var idx = flat.length;
      flat.push({ kana: c[0], ro: c[1] });
      var b = el("button", "cell");
      b.type = "button";
      b.setAttribute("aria-label", c[0] + ", " + c[1] + ". Watch its stroke order");
      b.setAttribute("lang", "ja");
      b.appendChild(el("span", "kana", c[0]));
      b.appendChild(el("span", "ro", c[1]));
      b.addEventListener("click", function () { openAt(idx); });
      chart.appendChild(b);
    });
  });

  var dlg = document.getElementById("dlg");
  var stage = document.getElementById("stage");
  var cur = -1, speed = 1, loop = true;

  /* ---------- stroke-order drawing ---------- */
  // STROKES (the dictionary's js/strokes.js): character → [[svgPathD, numberX, numberY], …] in a 109×109 box.
  var DATA = typeof STROKES !== "undefined" ? STROKES : {};
  var SVG = "http://www.w3.org/2000/svg";
  var UNIT = 0.75;   // seconds per stroke at 1×: 80% drawing, 20% rest
  var HOLD = 1.4;    // seconds the finished character stays before the loop restarts
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var strokes = [];  // {p: ink path, tx: its number}
  var t = 0, held = 0, last = 0, raf = 0;

  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVG, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  function buildStage(ch) {
    stage.textContent = "";
    strokes = [];
    var data = DATA[ch];
    if (!data) {   // no stroke data (strokes.js didn't load): the character itself
      var g = el("span", "glyph", ch);
      g.setAttribute("lang", "ja");
      stage.appendChild(g);
      return;
    }
    var svg = svgEl("svg", { "class": "draw", viewBox: "0 0 109 109", "aria-hidden": "true" });
    var ghost = svgEl("g", { "class": "ghost" }), ink = svgEl("g", { "class": "ink" }), nums = svgEl("g", {});
    data.forEach(function (s, i) {
      ghost.appendChild(svgEl("path", { d: s[0] }));
      var p = svgEl("path", { d: s[0], pathLength: 1 });
      var tx = svgEl("text", { x: s[1], y: s[2] });
      tx.textContent = i + 1;
      ink.appendChild(p);
      nums.appendChild(tx);
      strokes.push({ p: p, tx: tx });
    });
    svg.appendChild(ghost); svg.appendChild(ink); svg.appendChild(nums);
    stage.appendChild(svg);
  }

  function ease(x) { return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  // t runs from 0 to the number of strokes; stroke i is drawn while t goes from i to i + 0.8.
  function draw() {
    var n = strokes.length;
    strokes.forEach(function (s, i) {
      var raw = Math.max(0, Math.min(1, (t - i) / 0.8));
      var f = reduce.matches ? (t > i ? 1 : 0) : ease(raw);   // reduced motion: strokes appear whole, one by one
      s.p.style.strokeDashoffset = String(1 - f);
      s.p.style.visibility = f > 0 ? "visible" : "hidden";
      s.p.classList.toggle("cur", t < n && t > i && t <= i + 1);
      s.tx.style.visibility = t > i ? "visible" : "hidden";
    });
  }

  function frame(now) {
    raf = 0;
    if (!dlg.open || !strokes.length) return;
    var dt = Math.min(100, now - last) / 1000;
    last = now;
    var n = strokes.length;
    if (t < n) t = Math.min(n, t + dt * speed / UNIT);
    else if (!loop || reduce.matches) { draw(); return; }      // finished: stay on the whole character
    else if ((held += dt) >= HOLD) { t = 0; held = 0; }
    draw();
    raf = requestAnimationFrame(frame);
  }

  function play(fromStart) {
    if (fromStart) { t = 0; held = 0; }
    draw();
    if (raf) return;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function hashSet(v) {
    try { history.replaceState(null, "", v ? "#" + v : location.pathname + location.search); } catch (e) {}
  }

  function openAt(i) {
    var n = flat.length;
    i = (i + n) % n;
    cur = i;
    var c = flat[i];
    document.getElementById("dlg-kana").textContent = c.kana;
    buildStage(c.kana);
    document.getElementById("dlg-title").textContent = c.ro;
    document.getElementById("dlg-hira").textContent = hira(c.kana);
    document.getElementById("dlg-pos").textContent = (i + 1) + " / " + n;
    document.getElementById("prev-k").textContent = flat[(i + n - 1) % n].kana;
    document.getElementById("next-k").textContent = flat[(i + 1) % n].kana;
    if (!dlg.open) dlg.showModal();
    play(true);
    hashSet(c.ro);
  }

  function closeDlg() { if (dlg.open) dlg.close(); }

  dlg.addEventListener("close", function () {
    cancelAnimationFrame(raf); raf = 0;
    cur = -1;
    hashSet("");
  });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) closeDlg(); });
  dlg.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); openAt(cur + 1); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); openAt(cur - 1); }
  });

  document.getElementById("close").addEventListener("click", closeDlg);
  document.getElementById("prev").addEventListener("click", function () { openAt(cur - 1); });
  document.getElementById("next").addEventListener("click", function () { openAt(cur + 1); });

  document.getElementById("replay").addEventListener("click", function () { play(true); });
  stage.addEventListener("click", function () { play(true); });

  var loopBtn = document.getElementById("loop");
  loopBtn.addEventListener("click", function () {
    loop = !loop; loopBtn.setAttribute("aria-pressed", String(loop));
    if (loop) play(false);
  });

  var speedBtns = Array.prototype.slice.call(document.querySelectorAll("[data-speed]"));
  speedBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      speed = parseFloat(b.dataset.speed);
      speedBtns.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    });
  });

  // Deep link: #ka opens カ.
  function fromHash() {
    var h = location.hash.slice(1);
    var i = flat.findIndex(function (c) { return c.ro === h; });
    if (i >= 0 && i !== cur) openAt(i);
    else if (!h && dlg.open) closeDlg();
  }
  window.addEventListener("hashchange", fromHash);
  fromHash();
</script>
